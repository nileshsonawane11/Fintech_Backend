server:
  port: ${ACCOUNT_SERVICE_PORT:8082}

spring:
  application:
    name: ACCOUNT-SERVICE

  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/fintech_account}
    username: ${ACCOUNT_DB_USERNAME:postgres}
    password: ${ACCOUNT_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
    issuer: ${JWT_ISSUER:identity-service}

app:
  kafka:
    topics:
      account-events: account-events
      notification-events: notification-events
  services:
    customer-service:
      url: ${CUSTOMER_SERVICE_URL:http://localhost:8084}
    identity-service:
      url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true

logging:
  level:
    com.fintech.account: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
