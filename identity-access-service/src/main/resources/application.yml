server:
  port: 8081

spring:
  application:
    name: IDENTITY-SERVICE

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintech_identity}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        "[spring.json.add.type.headers]": false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

identity:
  jwt:
    issuer: identity-service
    access-token-minutes: 30
    mfa-token-minutes: 5
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/public.pem}

  otp:
    expiry-minutes: 5
    max-attempts: 5
    development-log-code: ${OTP_LOG_CODE:true}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO