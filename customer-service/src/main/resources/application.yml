
server:
  port: 8084

spring:
  application:
    name: CUSTOMER-SERVICE

  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/fintech_customer}
    username: ${CUSTOMER_DB_USERNAME:postgres}
    password: ${CUSTOMER_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: customer-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer

  security:
    filter:
      dispatcher-types: request,async,error

app:
  kafka:
    topics:
      customer-registered: identity.customer-events.v1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: never

security:
  jwt:
    public-key-location: classpath:keys/public.pem

  data-encryption-key: "A6zUYKLUu7Q98OeKx77T7AxCZ+yxJKR40JgJNyEaZg4="

storage:
  local:
    root: ${FINBANK_KYC_STORAGE_PATH:./data/kyc-documents}
  s3:
    bucket: ${CUSTOMER_DOCUMENT_BUCKET:fintech-customer-documents}
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    upload-url-minutes: 5
    max-file-size-bytes: 10485760

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: TRACE
    com.fintech.customer: DEBUG
    org.springframework.kafka: DEBUG
    org.apache.kafka.clients.consumer: INFO