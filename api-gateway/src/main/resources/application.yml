server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

          routes:

            # Identity and Access Service
            - id: identity-access-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/v1/auth/**,
                  /api/v1/consents/**,
                  /api/v1/admin/**,

            # Customer and KYC Service
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers/**,/ops/api/v1/kyc/**

            # Ledger and Transaction Service (Account specific ledger endpoints routed first)
            - id: ledger-service
              uri: lb://LEDGER-TRANSACTION-SERVICE
              predicates:
                - Path=/api/v1/accounts/*/balance,/api/v1/accounts/*/balance-history,/api/v1/accounts/balances,/api/v1/accounts/*/transactions,/api/v1/accounts/*/holds,/api/v1/transactions/**,/api/v1/transfers/**,/api/v1/deposits/**,/api/v1/withdrawals/**,/api/v1/balances/**,/ops/api/v1/transactions/**,/ops/api/v1/deposits/**,/ops/api/v1/withdrawals/**,/ops/api/v1/ledger/**,/ops/api/v1/holds/**,/ops/api/v1/reconciliation/**,/ops/api/v1/reversals/**,/ops/api/v1/accounts/*/balance

            # Account Service
            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/v1/accounts/**,/ops/api/v1/accounts/**,/api/v1/account-products/**,/ops/api/v1/account-products/**,/ops/api/v1/account-applications/**,/ops/api/v1/holds/**

            # Payment Service
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/beneficiaries/**,/api/v1/payments/**

            # Card Service
            - id: card-service
              uri: lb://CARD-SERVICE
              predicates:
                - Path=/api/v1/cards/**

            # Loan Service
            - id: loan-service
              uri: lb://LOAN-SERVICE
              predicates:
                - Path=/api/v1/loans/**

            # Notification and Support Service
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/support/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: INFO
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/public.pem}
  issuer: ${JWT_ISSUER:identity-service}

resilience4j:
  circuitbreaker:
    instances:
      identityServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

      customerServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
