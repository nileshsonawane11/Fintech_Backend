server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          discovery:
            locator:
              enabled: false

          routes:

            # OpenAPI Documentation Routes
            - id: identity-service-docs
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/identity/v3/api-docs, /identity/v3/api-docs/**
              filters:
                - RewritePath=/identity/(?<segment>.*), /$\{segment}

            - id: customer-service-docs
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customer/v3/api-docs, /customer/v3/api-docs/**
              filters:
                - RewritePath=/customer/(?<segment>.*), /$\{segment}

            - id: ledger-service-docs
              uri: lb://LEDGER-TRANSACTION-SERVICE
              predicates:
                - Path=/ledger/v3/api-docs, /ledger/v3/api-docs/**
              filters:
                - RewritePath=/ledger/(?<segment>.*), /$\{segment}

            - id: account-service-docs
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/account/v3/api-docs, /account/v3/api-docs/**
              filters:
                - RewritePath=/account/(?<segment>.*), /$\{segment}

            - id: payment-service-docs
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment/v3/api-docs, /payment/v3/api-docs/**
              filters:
                - RewritePath=/payment/(?<segment>.*), /$\{segment}

            - id: card-service-docs
              uri: lb://CARD-SERVICE
              predicates:
                - Path=/card/v3/api-docs, /card/v3/api-docs/**
              filters:
                - RewritePath=/card/(?<segment>.*), /$\{segment}

            - id: loan-service-docs
              uri: lb://LOAN-SERVICE
              predicates:
                - Path=/loan/v3/api-docs, /loan/v3/api-docs/**
              filters:
                - RewritePath=/loan/(?<segment>.*), /$\{segment}

            - id: investment-service-docs
              uri: lb://INVESTMENT-SERVICE
              predicates:
                - Path=/investment/v3/api-docs, /investment/v3/api-docs/**
              filters:
                - RewritePath=/investment/(?<segment>.*), /$\{segment}

            - id: notification-service-docs
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notification/v3/api-docs, /notification/v3/api-docs/**
              filters:
                - RewritePath=/notification/(?<segment>.*), /$\{segment}

            # Identity and Access Service
            - id: identity-access-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/v1/auth/**,
                  /api/v1/consents/**,
                  /api/v1/admin/**,

            # Customer and KYC Service
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers/**,/ops/api/v1/kyc/**

            # Ledger and Transaction Service (Account specific ledger endpoints routed first)
            - id: ledger-service
              uri: lb://LEDGER-TRANSACTION-SERVICE
              predicates:
                - Path=/api/v1/accounts/*/balance,/api/v1/accounts/*/balance-history,/api/v1/accounts/balances,/api/v1/accounts/*/transactions,/api/v1/accounts/*/holds,/api/v1/transactions/**,/api/v1/transfers/**,/api/v1/deposits/**,/api/v1/withdrawals/**,/api/v1/balances/**,/ops/api/v1/transactions/**,/ops/api/v1/deposits/**,/ops/api/v1/withdrawals/**,/ops/api/v1/ledger/**,/ops/api/v1/holds/**,/ops/api/v1/reconciliation/**,/ops/api/v1/reversals/**,/ops/api/v1/accounts/*/balance,/ops/api/v1/accounts/*/rebuild-balance,/api/v1/ledger/**

            # Account Service
            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/v1/accounts/**,/ops/api/v1/accounts/**,/api/v1/account-products/**,/ops/api/v1/account-products/**,/ops/api/v1/account-applications/**

            # Payment Service
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**,/ops/api/v1/payments/**

            # Card Service
            - id: card-service
              uri: lb://CARD-SERVICE
              predicates:
                - Path=/api/v1/cards/**,/ops/api/v1/cards/**,/api/v1/card-products/**,/api/v1/public/card-products/**,/public/api/v1/card-products/**,/ops/api/v1/card-products/**

            # Loan Service
            - id: loan-service
              uri: lb://LOAN-SERVICE
              predicates:
                - Path=/api/v1/loans/**

            # Investment Service
            - id: investment-service
              uri: lb://INVESTMENT-SERVICE
              predicates:
                - Path=/api/v1/investments/**

            # Notification and Support Service
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/support/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    urls-primary-name: Identity Service
    urls:
      - name: Identity Service
        url: /identity/v3/api-docs
      - name: Customer Service
        url: /customer/v3/api-docs
      - name: Ledger and Transaction Service
        url: /ledger/v3/api-docs
      - name: Account Service
        url: /account/v3/api-docs
      - name: Payment Service
        url: /payment/v3/api-docs
      - name: Card Service
        url: /card/v3/api-docs
      - name: Loan Service
        url: /loan/v3/api-docs
      - name: Investment Service
        url: /investment/v3/api-docs
      - name: Notification and Support Service
        url: /notification/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: INFO
    org.springframework.security: WARN
    org.springframework.security.oauth2: WARN

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/public.pem}
  issuer: ${JWT_ISSUER:identity-service}

resilience4j:
  circuitbreaker:
    instances:
      identityServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

      customerServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
