server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

          routes:

            # Identity and Access Service
            - id: identity-access-service
              uri: lb://IDENTITY-ACCESS-SERVICE
              predicates:
                - Path=/api/v1/auth/**,/api/v1/consents/**,/admin/api/v1/**

            # Customer and KYC Service
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers/**,/ops/api/v1/kyc/**

            # Account Service
            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/v1/accounts/**,/ops/api/v1/accounts/**

            # Ledger and Transaction Service
            - id: ledger-service
              uri: lb://LEDGER-SERVICE
              predicates:
                - Path=/api/v1/transactions/**,/api/v1/balances/**

            # Payment Service
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/beneficiaries/**,/api/v1/payments/**

            # Card Service
            - id: card-service
              uri: lb://CARD-SERVICE
              predicates:
                - Path=/api/v1/cards/**

            # Loan Service
            - id: loan-service
              uri: lb://LOAN-SERVICE
              predicates:
                - Path=/api/v1/loans/**

            # Notification and Support Service
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/support/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: INFO