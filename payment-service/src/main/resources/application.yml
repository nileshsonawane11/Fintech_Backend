server:
  port: ${PAYMENT_SERVICE_PORT:8085}

spring:
  application:
    name: PAYMENT-SERVICE

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/fintech_payment}
    username: ${PAYMENT_DB_USERNAME:postgres}
    password: ${PAYMENT_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: true

  jackson:
    time-zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: ${PAYMENT_KAFKA_GROUP_ID:payment-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

payment:
  jwt:
    public-key-location: ${PAYMENT_JWT_PUBLIC_KEY:classpath:keys/public.pem}
    issuer: ${JWT_ISSUER:identity-service}
  idempotency:
    ttl-hours: ${PAYMENT_IDEMPOTENCY_TTL_HOURS:24}
  outbox:
    poll-interval-ms: ${PAYMENT_OUTBOX_POLL_INTERVAL_MS:3000}
    max-retries: ${PAYMENT_OUTBOX_MAX_RETRIES:5}
    batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:50}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    poll-interval-ms: ${PAYMENT_RECONCILIATION_INTERVAL_MS:300000}
    stale-threshold-minutes: ${PAYMENT_RECONCILIATION_STALE_MINUTES:5}

app:
  services:
    identity-service:
      service-id: ${IDENTITY_SERVICE_ID:IDENTITY-SERVICE}
    customer-service:
      service-id: ${CUSTOMER_SERVICE_ID:CUSTOMER-SERVICE}
    account-service:
      service-id: ${ACCOUNT_SERVICE_ID:ACCOUNT-SERVICE}
    ledger-service:
      service-id: ${LEDGER_SERVICE_ID:LEDGER-TRANSACTION-SERVICE}
    internal-secret-token: ${INTERNAL_SERVICE_TOKEN:finbank-internal-secret-token}
    connect-timeout-ms: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:5000}
  kafka:
    topics:
      incoming-events: ${KAFKA_TOPIC_PAYMENT_INCOMING:payment.incoming-events.v1}
      reconciliation-events: ${KAFKA_TOPIC_PAYMENT_RECONCILIATION:payment.reconciliation-events.v1}
      ledger-transaction-events: ${KAFKA_TOPIC_LEDGER_TRANSACTIONS:ledger.transaction-events.v1}
      account-lifecycle-events: ${KAFKA_TOPIC_ACCOUNT_LIFECYCLE:account.lifecycle-events.v1}
      notification-events: ${KAFKA_TOPIC_NOTIFICATION_EVENTS:notification.events.v1}

razorpay:
  environment: ${RAZORPAY_ENVIRONMENT:test}
  base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
  key-id: ${RAZORPAY_KEY_ID:rzp_test_S4sX5okSKuRRvq}
  key-secret: ${RAZORPAY_KEY_SECRET:ESSc6xxF6BAGZ21PFNWso9Dn}
  connect-timeout-ms: ${RAZORPAY_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${RAZORPAY_READ_TIMEOUT_MS:15000}
  max-get-retries: ${RAZORPAY_MAX_GET_RETRIES:2}
  auto-capture: ${RAZORPAY_AUTO_CAPTURE:true}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true