
server:
  port: 8086

spring:
  application:
    name: card-service

  datasource:
    url: ${CARD_DB_URL:jdbc:postgresql://localhost:5432/fintech_card}
    username: ${CARD_DB_USERNAME}
    password: ${CARD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem
          issuer-uri: ${JWT_ISSUER:fintech-identity-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
