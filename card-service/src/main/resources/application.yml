server:
  port: 8086

spring:
  application:
    name: card-service

  datasource:
    url: ${CARD_DB_URL:jdbc:postgresql://localhost:5432/fintech_card}
    username: ${CARD_DB_USERNAME:postgres}
    password: ${CARD_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: true

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem
          issuer-uri: ${JWT_ISSUER:fintech-identity-service}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  services:
    account-service:
      service-id: ${ACCOUNT_SERVICE_ID:ACCOUNT-SERVICE}
    customer-service:
      service-id: ${CUSTOMER_SERVICE_ID:CUSTOMER-SERVICE}
  kafka:
    topics:
      card-events: ${CARD_EVENTS_TOPIC:card.events.v1}
      card-application-events: ${CARD_APPLICATION_EVENTS_TOPIC:card.application-events.v1}
      notification-events: ${KAFKA_TOPIC_NOTIFICATION_EVENTS:notification.events.v1}
  outbox:
    poll-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    enabled: true
